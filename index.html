<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phillies News Reader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div>
    <h1>PHILLIES NEWS</h1>
    <p>Philadelphia Phillies News Reader</p>
  </div>

  <button id="unreadBtn">未読のみ</button>
</header>

<main>

  <div class="filters">

    <button class="period active" data-days="1">
      24時間
    </button>

    <button class="period" data-days="3">
      3日
    </button>

    <button class="period" data-days="7">
      7日
    </button>

    <button class="period" data-days="0">
      すべて
    </button>

  </div>

  <div class="bar">

    <span id="count">
      読み込み中…
    </span>

    <button id="allBtn">
      すべて表示
    </button>

    <button id="clearBtn">
      既読をリセット
    </button>

  </div>

  <section id="articles"></section>

</main>

<script src="app.js"></script>

</body>
</html>
